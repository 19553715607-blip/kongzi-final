    .nav{width:min(1152px,100%);margin:auto;padding:0 24px;display:flex;align-items:center;gap:30px}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--fg)}.mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:white;display:grid;place-items:center;font-family:serif;font-size:18px;box-shadow:0 4px 12px rgba(36,94,168,.18)}.brand-name{font-family:serif;font-size:16px;letter-spacing:.2em}.links{display:flex;gap:4px}.links a{color:var(--muted);font-size:13px;text-decoration:none;padding:8px 14px;border-radius:999px}.links a.active{background:var(--accent);color:#fff}.tools{margin-left:auto;display:flex;gap:8px;align-items:center}.tool{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;color:var(--muted);font-size:12px}

adow:0 2px 8px rgba(31,55,82,.04)}.footer-links{display:flex;gap:24px;margin-top:46px}.footer-links a{font-size:12px;color:var(--faint);text-decoration:none}.footer-links a:hover{color:var(--accent)}
    @media(max-width:760px){header{height:62px}.nav{padding:0 18px}.links{display:none}main{display:block;padding:46px 20px 88px}.rail{display:none}.content{padding:0}.content h1{font-size:52px}.lead{font-size:18px}.cards{grid-template-columns:1fr;margin-top:36px}.card{min-height:190px;padding:26px}.try{align-items:flex-start;flex-direction:column;gap:10px}.footer-links{margin-top:34px}}
