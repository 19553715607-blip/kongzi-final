# 孔子 · 儒家语义平台 — 一键起 docker compose
# 用法：
#   1. cp backend/.env.example backend/.env  并填入 QWEN_API_KEY 等
#   2. docker compose up -d
#   3. 浏览器 → http://localhost:3000
#
# 包含：
#   - neo4j  (图谱)
#   - backend (FastAPI + Chroma + bge-m3)
#   - frontend (Next.js standalone)

services:
  neo4j:
    image: docker.m.daocloud.io/library/neo4j:5-community
    container_name: kongzi-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-kongzi-graph}"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: kongzi-backend
    depends_on:
      neo4j:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # 容器内覆盖：用 neo4j 服务名而非 localhost
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/kongzi.db}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-kongzi-graph}
      GRAPH_BACKEND: ${GRAPH_BACKEND:-neo4j}
      CHROMA_PATH: /data/chroma
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # HuggingFace 走本地缓存（不连 huggingface.co，否则启动会卡在拉模型）
      # bge-m3 模型已在 backend_data volume 的 /data/hf_home 里
      HF_HUB_OFFLINE: "1"
      HF_HOME: /data/hf_home
      SENTENCE_TRANSFORMERS_HOME: /data/hf_home/hub
      TRANSFORMERS_OFFLINE: "1"
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: kongzi-frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  neo4j_data:
  backend_data:
